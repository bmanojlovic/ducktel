# ducktel — OTLP receiver + Parquet storage + DuckDB query.
#
# Two containers share one pod and one data volume:
#   otlp  receives telemetry on 4318 (write side; token held by senders)
#   mcp   serves queries on 4319    (read side;  token held by consumers)
#
# They are separate trust domains, so they carry separate tokens — see the
# Secret below. A compromised sender must not gain read access, and a reader
# must not be able to forge spans.
#
# Why two containers in one pod rather than two Deployments: the volume is
# local-path (RWO, node-pinned), so a second Deployment could be scheduled onto
# a node that does not hold the data. Sharing a pod guarantees co-location.
#
# Single writer by design: the otlp container is the only process that writes.
# Scaling replicas would put two writers on one data directory and silently lose
# telemetry (collisions in the per-minute parquet filenames), hence replicas: 1
# and strategy Recreate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ducktel
  namespace: ducktel
  labels:
    app.kubernetes.io/name: ducktel
spec:
  replicas: 1
  strategy:
    # Never run two writers at once, not even briefly during a rollout.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ducktel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ducktel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot
        fsGroup: 65532
      containers:
        # --- write side: OTLP ingest ---
        - name: otlp
          # Pinned to an immutable tag: a mutable tag let a pod start on a
          # stale build (the earlier `unknown flag: --http` crashloop).
          image: ghcr.io/bmanojlovic/ducktel:sha-7d1a4df
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --host
            - 0.0.0.0
            - --port
            - "4318"
            - --data-dir
            - /data
            - --flush-interval
            - 30s
          ports:
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          env:
            # The writer holds BOTH secrets:
            #   DUCKTEL_AUTH_TOKEN  authorises OTLP ingest (held by senders)
            #   DUCKTEL_MCP_TOKEN   authorises POST /flush, so the query
            #                       container can ask for a flush without ever
            #                       holding write access. serve() accepts the
            #                       MCP token on /flush for exactly this reason.
            - name: DUCKTEL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ducktel-tokens
                  key: otlp-token
            - name: DUCKTEL_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ducktel-tokens
                  key: mcp-token
          livenessProbe:
            httpGet:
              path: /health
              port: otlp-http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: otlp-http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # ~27 MB observed at 100 traces/s, so 512 MiB bounds a leak
              # without constraining normal operation.
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
        # --- read side: MCP query tools ---
        - name: mcp
          # Pinned to an immutable tag: a mutable tag let a pod start on a
          # stale build (the earlier `unknown flag: --http` crashloop).
          image: ghcr.io/bmanojlovic/ducktel:sha-7d1a4df
          imagePullPolicy: IfNotPresent
          args:
            - mcp
            - --http
            - --host
            - 0.0.0.0
            - --port
            - "4319"
            - --base-path
            - /mcp
            - --data-dir
            - /data
            - --flush-url
            # Same pod, so the writer is reachable on localhost. The request is
            # authorised with this container's own (read) token, which the
            # writer accepts on /flush — so this container can trigger a flush
            # but never holds write access.
            - http://localhost:4318/flush
            # Human-facing dashboard + REST API, same mux/port/token as the
            # MCP server above — one more transport onto identical query
            # logic, not a second trust domain, so no new Secret is needed.
            - --dashboard
          ports:
            - name: mcp-http
              containerPort: 4319
              protocol: TCP
          env:
            # A DIFFERENT token from the OTLP one. This grants read access to
            # every tenant, so it belongs only to consumers (e.g. a workstation
            # querying over the VPN), never to senders.
            - name: DUCKTEL_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ducktel-tokens
                  key: mcp-token
          livenessProbe:
            httpGet:
              path: /health
              port: mcp-http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: mcp-http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Querying opens DuckDB over the parquet files; bound it so a
              # large aggregation cannot take the node down.
              memory: 1Gi
          volumeMounts:
            # Read-only: the MCP container never writes, which also makes it
            # impossible for a query path to corrupt stored telemetry.
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ducktel-data
---
# NOTE: the bearer tokens are deliberately NOT declared here. A Secret with
# placeholder values in version control is a footgun: `kubectl apply -f` this
# file and it overwrites the live credentials (this happened once). Create them
# out of band, and let Terraform manage them instead:
#
#   kubectl create secret generic ducktel-tokens -n ducktel \
#     --from-literal=otlp-token="$(openssl rand -hex 32)" \
#     --from-literal=mcp-token="$(openssl rand -hex 32)"
#
# The two tokens are separate trust domains:
#   otlp-token  authorises OTLP ingest   (held by senders)
#   mcp-token   authorises MCP reads AND POST /flush
#               (held by consumers; cannot write telemetry)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ducktel-data
  namespace: ducktel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ducktel
  namespace: ducktel
  labels:
    app.kubernetes.io/name: ducktel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ducktel
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ducktel-mcp
  namespace: ducktel
  labels:
    app.kubernetes.io/name: ducktel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ducktel
  ports:
    - name: mcp-http
      port: 4319
      targetPort: mcp-http
      protocol: TCP
